x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

x-runtime: &runtime
  image: vynmatrix/platform:${VM_DEPLOY_IMAGE_TAG:-latest}
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  networks: [vm]
  logging: *bounded-logging
  volumes:
    - ../Data:/data
    - ../.artifacts:/app/.artifacts:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks: [vm]
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  application:
    <<: *runtime
    command: ["python", "-m", "scripts.run_platform", "${PLATFORM_APPLICATION_GROUP:-application}"]
    environment:
      # The union supports the all variant with this same container identity.
      # The launcher passes only the selected role's allowlist to each process.
      <<: [*common-env, *api-env, *worker-env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"

  workers:
    <<: *runtime
    profiles: ["workers"]
    command: ["python", "-m", "scripts.run_platform", "workers"]
    environment:
      <<: [*common-env, *worker-env]
    depends_on:
      postgres:
        condition: service_healthy
      application:
        condition: service_healthy

  # This job has no automatic runtime dependents. vmdev stops both groups first;
  # an exited bootstrap occupies no runtime slot and is removed by compose run.
  bootstrap:
    image: vynmatrix/platform:${VM_DEPLOY_IMAGE_TAG:-latest}
    profiles: ["maintenance"]
    init: true
    command: ["python", "-m", "dev_cli.main", "db", "bootstrap", "--inside-container"]
    environment:
      EXECUTION_MODE: paper
      EXECUTION_ENGINE_ALLOW_LIVE: "false"
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      VM_DEPLOY_IMAGE_TAG: ${VM_DEPLOY_IMAGE_TAG:-latest}
      VM_BACKEND_DB_PASSWORD: ${VM_BACKEND_DB_PASSWORD:-}
      VM_SCORING_DB_PASSWORD: ${VM_SCORING_DB_PASSWORD:-}
      VM_EXECUTION_DB_PASSWORD: ${VM_EXECUTION_DB_PASSWORD:-}
      VM_FEEDBACK_DB_PASSWORD: ${VM_FEEDBACK_DB_PASSWORD:-}
      VM_MARKET_DATA_DB_PASSWORD: ${VM_MARKET_DATA_DB_PASSWORD:-}
      VM_INDICATOR_DB_PASSWORD: ${VM_INDICATOR_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vm]
    logging: *bounded-logging
    restart: "no"
    stop_grace_period: 60s
    healthcheck:
      disable: true

networks:
  vm:
    driver: bridge

volumes:
  postgres-data:
    driver: local
