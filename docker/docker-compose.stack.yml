# Single-owner paper stack. Build only with vmdev build docker --from-config.
# Bootstrap/upgrade is driven by vmdev db bootstrap; it stops application/workers
# before running the explicit maintenance job. Never use --profile '*' up.
# Split: COMPOSE_PROFILES=workers, PLATFORM_APPLICATION_GROUP=application.
# Combined: no workers profile, PLATFORM_APPLICATION_GROUP=all.
# Both layouts use the same application service identity; no extra all service.
# Always pass --env-file .env from the repository root.
name: vynmatrix

