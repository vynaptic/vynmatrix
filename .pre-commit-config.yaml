# Pre-commit hooks configuration
# Install: vmdev git install && pre-commit install-hooks

exclude: ^(\.agents/|\.claude/|\.codex/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000000']
      - id: check-merge-conflict

      # CRITICAL: Validate Python syntax (prevents broken code commits).
      # Runs on staged files only (fast). All tracked strategy files now parse
      # cleanly; this is the guard against re-introducing syntax errors.
      - id: check-ast
        name: Check Python AST (syntax validation)
        stages: [pre-commit]  # Only run on commit, not on all files

      # CRITICAL: Validate JSON files (config.json in strategies)
      - id: check-json
        name: Check JSON syntax
        exclude: ^Data/alternative/alphastreams/portfoliostate/

      # SECURITY: Prevent committing secrets
      - id: detect-private-key
        name: Detect private keys
        exclude: ^(.*\.md$|.*\.txt$|docs/)

      # Additional safety checks
      - id: check-case-conflict
        name: Check for case conflicts in filenames
      - id: check-symlinks
        name: Check for broken symlinks
      - id: check-toml
        name: Check TOML syntax
      - id: fix-byte-order-marker
        name: Remove UTF-8 byte order marker
      - id: mixed-line-ending
        name: Check for mixed line endings
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(build/|dist/)
      # Canonical formatter (CI also runs `ruff format --check`).
      - id: ruff-format
        exclude: ^(build/|dist/)

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        exclude: ^(build/|dist/|.*/tests/|tests/|\.venv/|.*setup\.py$|scripts/db/alembic/)
        # --ignore-missing-imports: the pre-commit isolated env can't install
        # the full runtime dep tree. CI also runs an explicit pinned check over
        # scoring_engine and feedback_loop_engine with the runtime dependencies.
        args:
          [
            --config-file=pyproject.toml,
            --no-incremental,
            --ignore-missing-imports,
            --no-warn-unused-ignores,
          ]
        additional_dependencies:
          - pydantic>=2.0.0
          - types-PyYAML>=6.0.0
          - pandas>=2.0.0
          # SQLAlchemy 2.0 ships inline types; without it every Session/Result
          # value is Any and the ORM-heavy modules cannot be truly checked
          # (this gap forced the old repositories.* mypy override).
          - sqlalchemy>=2.0.51

  # Guardrail: disallow direct order placement in indicator strategies (signal-only architecture)
  - repo: local
    hooks:
      - id: forbid-direct-orders-in-indicator-strategies
        name: "forbid SetHoldings/MarketOrder in indicator strategies"
        entry: bash -c 'set -euo pipefail; files=$(find strategies/indicator -path "*/backtests/*" -prune -o -path "*/_template/*" -prune -o -name "*.py" -print); if [ -n "$files" ]; then if grep -nE "SetHoldings|MarketOrder|StopMarketOrder" $files; then echo "Direct order calls found in indicator strategies (signal-only architecture). Remove them." >&2; exit 1; fi; fi'
        language: system
        types: [python]
        pass_filenames: false

      # Architecture-quality gate. See ``vmdev audit --help`` and CLAUDE.md
      # § "Architecture audit gates" for the rule list. The hook fails on
      # errors; warnings (including documented migration exemptions) pass.
      - id: vmdev-audit
        name: "vmdev audit (architecture quality gates)"
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && PYTHONPATH=tools/dev_cli python -m dev_cli.main audit'
        language: system
        types: [python]
        pass_filenames: false
