# Canonical instrument hierarchy used by scoring engine.
#
# You can extend this list safely; the bootstrap script will upsert entries.
#
# Fields:
#   symbol        : Trading symbol as used by strategies (case-insensitive)
#   asset_class   : crypto | equity | etf | index | futures | options | fx | commodities
#   is_tradable   : false for reference-only cash indices; true by default otherwise
#   sector        : Logical sector bucket (e.g., technology, crypto, energy)
#   industry      : More specific grouping (e.g., semiconductors, layer1)
#   index         : Index membership label (e.g., SP500, NASDAQ100, CRYPTO100)
#   settlement_currency: Currency in which price, notional, and P&L settle
#   market_session_policy: continuous for crypto; scheduled for every other asset
#   aliases / broker_symbols: explicit compatible references from 02_seed_data.sql.
# Perpetual/derivative routes require their own concrete contract catalogue entry;
# the former BTC/ETH spot-to-perpetual seed mappings are deliberately excluded.
# IBKR/Saxo exact IDs below retain the official-reference identities in that seed.
instruments:
  # USDC-quoted pairs — the primary pairs for EUR-funded Coinbase accounts.
  # USD pairs remain valid global market-data and broker instruments.
  - symbol: BTCUSDC
    aliases: [{alias: BTCUSDC, source: seed}]
    broker_symbols: [{broker_code: coinbase, broker_symbol: BTC-USDC}]
    asset_class: crypto
    settlement_currency: USDC
    market_session_policy: continuous
    sector: crypto
    industry: layer1
    index: CRYPTO100
  - symbol: ETHUSDC
    aliases: [{alias: ETHUSDC, source: seed}]
    broker_symbols: [{broker_code: coinbase, broker_symbol: ETH-USDC}]
    asset_class: crypto
    settlement_currency: USDC
    market_session_policy: continuous
    sector: crypto
    industry: layer1
    index: CRYPTO100
  - symbol: SOLUSDC
    aliases: [{alias: SOLUSDC, source: seed}]
    broker_symbols: [{broker_code: coinbase, broker_symbol: SOL-USDC}]
    asset_class: crypto
    settlement_currency: USDC
    market_session_policy: continuous
    sector: crypto
    industry: layer1
    index: CRYPTO100
  - symbol: BTCUSD
    aliases: [{alias: BTCUSD, source: seed}]
    broker_symbols: [{broker_code: coinbase, broker_symbol: BTC-USD}]
    asset_class: crypto
    settlement_currency: USD
    market_session_policy: continuous
    sector: crypto
    industry: layer1
    index: CRYPTO100
  - symbol: ETHUSD
    aliases: [{alias: ETHUSD, source: seed}]
    broker_symbols: [{broker_code: coinbase, broker_symbol: ETH-USD}]
    asset_class: crypto
    settlement_currency: USD
    market_session_policy: continuous
    sector: crypto
    industry: layer1
    index: CRYPTO100
  - symbol: SOLUSD
    aliases: [{alias: SOLUSD, source: seed}]
    broker_symbols: [{broker_code: coinbase, broker_symbol: SOL-USD}]
    asset_class: crypto
    settlement_currency: USD
    market_session_policy: continuous
    sector: crypto
    industry: layer1
    index: CRYPTO100
  # Observed accounting FX legs. ECB publishes EUR quote rates; Coinbase
  # supplies the traded USDC/EUR leg used for stablecoin conversions.
  - symbol: EUR/USD
    broker_symbols:
      - {broker_code: ibkr, broker_symbol: EUR.USD}
      - {broker_code: saxo, broker_symbol: EURUSD, broker_instrument_id: "21", broker_instrument_type: FxSpot}
    asset_class: fx
    settlement_currency: USD
    market_session_policy: scheduled
    sector: fx
    industry: reference_rates
    index: ECB
  - symbol: EUR/GBP
    asset_class: fx
    settlement_currency: GBP
    market_session_policy: scheduled
    sector: fx
    industry: reference_rates
    index: ECB
  - symbol: EUR/INR
    asset_class: fx
    settlement_currency: INR
    market_session_policy: scheduled
    sector: fx
    industry: reference_rates
    index: ECB
  - symbol: USDC/EUR
    broker_symbols: [{broker_code: coinbase, broker_symbol: USDC-EUR}]
    asset_class: fx
    settlement_currency: EUR
    market_session_policy: scheduled
    sector: fx
    industry: stablecoin_fx
    index: COINBASE
  - symbol: SPY
    broker_symbols: [{broker_code: ibkr, broker_symbol: SPY}]
    asset_class: etf
    settlement_currency: USD
    market_session_policy: scheduled
    sector: etf
    industry: broad_market_etf
    index: SP500
  - symbol: QQQ
    broker_symbols: [{broker_code: ibkr, broker_symbol: QQQ}]
    asset_class: etf
    settlement_currency: USD
    market_session_policy: scheduled
    sector: etf
    industry: technology_etf
    index: NASDAQ100
  - symbol: AAPL
    broker_symbols: [{broker_code: ibkr, broker_symbol: AAPL, broker_instrument_id: "265598"}]
    asset_class: equity
    settlement_currency: USD
    market_session_policy: scheduled
    sector: technology
    industry: consumer_electronics
    index: NASDAQ100
  - symbol: MSFT
    asset_class: equity
    settlement_currency: USD
    market_session_policy: scheduled
    sector: technology
    industry: software
    index: NASDAQ100
  - symbol: NIFTY50
    asset_class: index
    is_tradable: false
    settlement_currency: INR
    market_session_policy: scheduled
    sector: india_index
    industry: broad_market_index
    index: NIFTY50
  - symbol: BANKNIFTY
    asset_class: index
    is_tradable: false
    settlement_currency: INR
    market_session_policy: scheduled
    sector: india_index
    industry: banking_index
    index: BANKNIFTY
