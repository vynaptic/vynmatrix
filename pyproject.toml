[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "build==1.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vynmatrix"
version = "0.1.0"
description = "vynmatrix trading platform monorepo"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    # Required to collect and exercise the indicator-runner process manager.
    "psutil>=7.2.2,<8.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    # Formatting and linting
    "ruff>=0.14.4,<1.0.0",
    # Type checking
    "mypy>=1.18.2,<2.0.0",
    # Type stubs
    "types-PyYAML>=6.0.0",
    # Pre-commit
    "pre-commit>=4.3.0,<5.0.0",
]

[tool.pytest.ini_options]
# Make direct ``pytest`` collection use the same in-repository package roots as
# ``vmdev test``.  This is required because the monorepo deliberately does not
# install every application package into the developer interpreter.
pythonpath = [
    ".",
    "libs/python/lib_common",
    "libs/python/lib_strategy",
    "libs/python/lib_indicators",
    "libs/python/lib_data",
    "libs/python/lib_application",
    "libs/python/lib_infrastructure",
    "tools/dev_cli",
    "apps/execution_engine",
    "apps/backend",
    "apps/scoring_engine",
    "apps/feedback_loop_engine",
    "apps/indicator_runner",
    "apps/market_data_ingestor",
    "strategies/indicator",
]
testpaths = [
    "tests",
    "apps/backend/tests",
    "apps/execution_engine/tests",
    "apps/scoring_engine/tests",
    "apps/feedback_loop_engine/tests",
    "apps/indicator_runner/tests",
    "apps/market_data_ingestor/tests",
    "libs/python/lib_application/tests",
    "libs/python/lib_common/tests",
    "libs/python/lib_data/tests",
    "libs/python/lib_indicators/tests",
    "libs/python/lib_infrastructure/tests",
    "libs/python/lib_strategy/tests",
    "strategies/indicator/USQualityCompounder/tests",
    "strategies/indicator/_template/tests",
    "tools/dev_cli/tests",
]
python_files = "test_*.py"
# importlib import mode avoids duplicate test-file basename collisions
# (e.g. lib_common/tests/test_config.py vs apps/execution_engine/tests/test_config.py)
# when multiple test trees are collected in one run.
addopts = "-v --import-mode=importlib"
markers = [
    "integration: tests that require external services such as PostgreSQL",
    "asyncio: tests that run asynchronous code",
]

[tool.coverage.run]
# Branch coverage catches missing else paths and short-circuit logic that line
# coverage misses. Source paths reflect the in-repo packages we want measured;
# tests themselves are excluded from the "covered" denominator.
branch = true
source = [
    "libs/python/lib_common/lib_common",
    "libs/python/lib_strategy/lib_strategy",
    "libs/python/lib_application/lib_application",
    "libs/python/lib_data/lib_data",
    "libs/python/lib_indicators/lib_indicators",
    "libs/python/lib_infrastructure/lib_infrastructure",
    "apps/backend/backend",
    "apps/execution_engine/execution_engine",
    "apps/scoring_engine/scoring_engine",
    "apps/feedback_loop_engine/feedback_loop_engine",
    "apps/indicator_runner/indicator_runner",
    "tools/dev_cli/dev_cli",
]
omit = [
    "*/tests/*",
    "*/build/*",
    "*/dist/*",
    "*/.venv*/*",
    "*/__main__.py",
]

[tool.coverage.report]
# CI passes ``--cov-fail-under=<floor>`` explicitly so we can ratchet the
# minimum upward as the suite grows. ``fail_under`` here is the local-default
# floor when developers run ``pytest --cov`` without a flag — kept conservative
# so the developer loop is fast to iterate on.
fail_under = 35
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"  # Target Python 3.11 for type checking
explicit_package_bases = true
mypy_path = [
    "apps/execution_engine",
    "apps/scoring_engine",
    "apps/feedback_loop_engine",
    "apps/indicator_runner",
    "apps/market_data_ingestor",
    "libs/python/lib_application",
    "libs/python/lib_common",
    "libs/python/lib_data",
    "libs/python/lib_indicators",
    "libs/python/lib_infrastructure",
    "libs/python/lib_strategy",
    "strategies/indicator",
    "tools/dev_cli",
]

# Basic warnings
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
warn_no_return = true
disable_error_code = ["import-untyped"]

# Gradual strictness - enable more over time
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# Start permissive, tighten in phases
disallow_untyped_defs = false  # TODO: Enable gradually per module
disallow_untyped_calls = false
disallow_any_explicit = false

# Error display
show_error_codes = true
show_error_context = true
pretty = true
color_output = true

# Exclude directories and setup.py files
exclude = [
    'build/',
    'dist/',
    '.venv/',
    'venv/',
    '__pycache__/',
    'setup.py',
    '.*/setup.py',
    '(^|/)tests/',
    'scripts/',
]

# Per-module strictness - gradually increase
[[tool.mypy.overrides]]
module = "lib_strategy.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "lib_common.*"
disallow_incomplete_defs = true
warn_return_any = true

# Ratchet (tracked like BARE_EXCEPT_BASELINE): remove one module or one error
# code per PR as the debt is paid down; never add entries without a comment.
# 2026-07-30: dropped the deleted scoring_engine.alias_provider entry, the
# repositories.* wildcard, and brokers.factory — all clean under every error
# code after the 2.0 select() migration and precise Engine typing.
[[tool.mypy.overrides]]
module = [
    "execution_engine.engine",
    "scoring_engine.engine",
    "lib_infrastructure.brokers.adapters.coinbase",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "index",
    "misc",
    "no-any-return",
    "redundant-cast",
    "return-value",
    "type-abstract",
]

[tool.ruff]
line-length = 100
target-version = "py311"  # Target Python 3.11

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "scripts",
]

# Formatter settings pinned so output is stable across Ruff versions.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "N",      # pep8-naming
    "UP",     # pyupgrade - PEP 585/604 builtins (dict/list, X | None) on py311
    "ANN",    # flake8-annotations (type hints)
    "ASYNC",  # flake8-async — blocking calls / unsafe patterns on the event loop
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "G",      # flake8-logging-format — lazy %-style logging arguments
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]

# Ignore specific rules that conflict or are too strict initially
ignore = [
    "ANN401",   # Dynamically typed expressions (Any) are disallowed
    "D",        # pydocstyle - can enable later
    "COM812",   # Trailing comma missing (conflicts with formatter)
    "ISC001",   # Implicit string concatenation (conflicts with formatter)
    "TRY003",   # Avoid specifying long messages outside exception class
    "PLR0913",  # Too many arguments - will enable gradually
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports and star imports
"tests/*" = ["ANN", "ARG", "DTZ", "E402", "E501", "EM101", "F841", "PLC0415", "PLR2004", "RUF059", "S101"]
"apps/*/tests/*" = ["ANN", "ARG", "DTZ", "E402", "E501", "EM101", "F841", "PLC0415", "PLR2004", "RUF059", "S101"]
"libs/python/*/tests/*" = ["ANN", "ARG", "DTZ", "E402", "E501", "EM101", "F841", "PLC0415", "PLR2004", "RUF059", "S101"]
"strategies/*/*/tests/*" = ["ANN", "ARG", "DTZ", "E402", "E501", "EM101", "F841", "I001", "PLC0415", "PLR2004", "RUF059", "S101"]
"tools/*/tests/*" = ["ANN", "ARG", "DTZ", "E402", "E501", "EM101", "F841", "PLC0415", "PLR2004", "RUF059", "S101"]
"apps/execution_engine/tests/test_execution_persistence.py" = ["I001"]
"libs/python/lib_common/lib_common/__init__.py" = ["I001"]
"libs/python/lib_strategy/lib_strategy/__init__.py" = ["I001"]
"libs/python/lib_application/lib_application/db/models/__init__.py" = ["RUF022"]
"scripts/*" = ["T20"]  # Allow print statements in scripts
"tools/reconciliation/fvg_local_cloud.py" = ["PLR0911", "PLR0915"]

[tool.ruff.lint.mccabe]
# Set maximum cyclomatic complexity
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 6
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = [
    "dev_cli",
    "execution_engine",
    "feedback_loop_engine",
    "indicator_runner",
    "lib_application",
    "lib_common",
    "lib_data",
    "lib_indicators",
    "lib_infrastructure",
    "lib_strategy",
    "market_data_ingestor",
    "scoring_engine",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
